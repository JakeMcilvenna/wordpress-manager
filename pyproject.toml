[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wordpress-manager"
version = "0.1.0"
description = "A private WordPress operations console with constrained stack provisioning"
requires-python = ">=3.11"
dependencies = ["Flask>=3.1.3,<3.2"]

[project.optional-dependencies]
production = ["gunicorn>=26.2,<27; sys_platform == 'linux'"]
test = ["pytest>=8,<10"]

[project.scripts]
wordpress-manager = "wordpress_manager.__main__:main"

[tool.setuptools.packages.find]
include = ["wordpress_manager*"]

[tool.setuptools.package-data]
wordpress_manager = ["templates/*.html", "templates/fragments/*.html", "static/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
