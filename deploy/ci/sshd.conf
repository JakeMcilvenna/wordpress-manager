# Root-owned; this account has no interactive shell, SFTP, SCP or forwarding.
Match User wm-deploy
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    AuthorizedKeysFile /etc/wordpress-manager-ci/authorized_keys
    AuthorizedKeysCommand none
    TrustedUserCAKeys none
    ForceCommand /usr/bin/python3 -I -B /usr/local/lib/wordpress-manager-ci/ssh_gate.py
    DisableForwarding yes
    PermitTTY no
    PermitTunnel no
    PermitUserRC no
    MaxSessions 1
Match all
