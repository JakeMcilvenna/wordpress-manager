# Local Docker-only Nginx site; port 8091 on the Windows loopback host.
server {
    listen 8080 default_server;
    server_name _;
    root /var/www/html;
    index index.php index.html;
    client_max_body_size 64m;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Fixed local-only runtime probe. Never pass a browser-supplied script path.
    # Port 8091 is published to 127.0.0.1 on the developer machine only.
    # The backing PHP file must never be directly requestable, even though
    # the generic PHP regex appears before the hidden-files deny rule.
    location = /.wm-dev-status.php {
        return 404;
    }

    location = /__wm_dev_status {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/.wm-dev-status.php;
        fastcgi_param SCRIPT_NAME /.wm-dev-status.php;
        fastcgi_pass wordpress:9000;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass wordpress:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location ~ /\. {
        deny all;
    }

    location = /wp-config.php {
        deny all;
    }
}
