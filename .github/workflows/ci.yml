name: Tests
on:
  push:
    branches-ignore: [production]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: python -m compileall -q wordpress_manager
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[test,browser]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_control.py
        env:
          WM_TEST_BROWSER: chromium
  deployment:
    # This job changes only its fresh, disposable GitHub-hosted Ubuntu VM.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Create clean disposable Ubuntu systemd guest
        run: |
          docker build -t wordpress-manager-deploy-test -f tests/deploy.Dockerfile .
          docker run -d --name wm-ci --privileged --cgroupns=private --tmpfs /run --tmpfs /tmp --mount "type=bind,source=$PWD,target=/repo,readonly" wordpress-manager-deploy-test
          docker exec wm-ci sh -c "printf 'disposable Ubuntu deployment test\n' > /run/wm-disposable-test"
      - name: Exercise actual installer, systemd, health checks and rollback
        run: docker exec wm-ci python3 /repo/tests/deploy_integration.py --disposable-system
      - name: Exercise restricted SSH and privileged production boundary
        run: docker exec wm-ci python3 /repo/tests/ci_deploy_integration.py --disposable-system
      - name: Exercise authenticated dashboard, restricted provisioner and private phpMyAdmin
        run: docker exec wm-ci python3 /repo/tests/stack_integration.py --disposable-system
      - name: Validate cloud-init template schema
        run: |
          docker exec wm-ci sh -c 'DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cloud-init'
          docker exec wm-ci cloud-init schema --config-file /repo/deploy/cloud-init.yaml
      - name: Remove disposable guest
        if: always()
        run: docker rm -f wm-ci
  release-artifact:
    needs: [test, browser, deployment]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build twice from the tested Git objects and verify every file
        env:
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 deploy/release.py build release.tar.gz --commit "$COMMIT"
          python3 deploy/release.py build repeat.tar.gz --commit "$COMMIT"
          cmp release.tar.gz repeat.tar.gz
          sha256sum --check release.tar.gz.sha256
          python3 deploy/release.py verify release.tar.gz "$(cut -d ' ' -f1 release.tar.gz.sha256)" --commit "$COMMIT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-release-${{ github.sha }}
          # Re-running all jobs may replace only this run's already-tested artifact.
          overwrite: true
          if-no-files-found: error
          retention-days: 14
          path: |
            release.tar.gz
            release.tar.gz.sha256
