# Add to compose.preview.yml for real local WordPress development:
# docker compose -f compose.preview.yml -f compose.stack.yml up --build
# This stack never contacts or controls the production Hetzner services.
services:
  dashboard:
    environment:
      WM_DEV_WORDPRESS_INTERNAL_URL: http://nginx:8080/
      WM_DEV_SECOND_SITE_ENABLED: "1"
      WM_DEV_BROKER_TOKEN: "wm-local-second-site-2026-isolated-dev-only-token"
    depends_on:
      site2-provisioner:
        condition: service_started
      database:
        condition: service_healthy
      wordpress:
        condition: service_started
      nginx:
        condition: service_started

  database:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: local-dev-only-root-password
      MARIADB_DATABASE: wordpress_dev
      MARIADB_USER: wordpress_dev
      MARIADB_PASSWORD: local-dev-only-wordpress-password
    volumes:
      - wordpress_database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # No public or host-side database port.

  wordpress:
    image: wordpress:php8.5-fpm
    depends_on:
      database:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: wordpress_dev
      WORDPRESS_DB_USER: wordpress_dev
      WORDPRESS_DB_PASSWORD: local-dev-only-wordpress-password
    volumes:
      - wordpress_files:/var/www/html
      - ./dev/wp-runtime-status.php:/var/www/html/.wm-dev-status.php:ro
    # FastCGI remains on the private Compose network, never published.

  nginx:
    # Rootless upstream Nginx: master and workers run without SETUID/SETGID.
    # Standard nginx:stable-alpine cannot work with cap_drop: [ALL].
    image: nginx/nginx-unprivileged:stable-alpine
    ports:
      - "127.0.0.1:8091:8080"
    depends_on:
      wordpress:
        condition: service_started
    volumes:
      - wordpress_files:/var/www/html:ro
      - ./dev/nginx-wordpress.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,nosuid,size=32m
      - /var/run:rw,nosuid,size=8m
      - /tmp:rw,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # First functional Create Website slot. These services have their OWN
  # database and files; no access to the existing test WordPress volumes.
  site2-database:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: local-second-site-only-root
      MARIADB_DATABASE: wm_second_site
      MARIADB_USER: wm_second_site
      MARIADB_PASSWORD: local-second-site-only-password
    volumes:
      - second_site_database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # Not published on the host.

  site2-wordpress:
    image: wordpress:php8.5-fpm
    depends_on:
      site2-database:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: site2-database:3306
      WORDPRESS_DB_NAME: wm_second_site
      WORDPRESS_DB_USER: wm_second_site
      WORDPRESS_DB_PASSWORD: local-second-site-only-password
    volumes:
      - second_site_files:/var/www/html
    # Dedicated private WordPress files, PHP process and database.

  site2-nginx:
    image: nginx/nginx-unprivileged:stable-alpine
    depends_on:
      site2-wordpress:
        condition: service_started
    ports:
      - "127.0.0.1:8092:8080"
    volumes:
      - second_site_files:/var/www/html:ro
      - ./dev/nginx-site2.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,nosuid,size=32m
      - /var/run:rw,nosuid,size=8m
      - /tmp:rw,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  site2-provisioner:
    image: wordpress:cli-2.12.0-php8.5
    user: "33:33"
    entrypoint: ["php", "-S", "0.0.0.0:8093", "-t", "/opt/wm-local",
                 "/opt/wm-local/provisioner.php"]
    working_dir: /var/www/html
    depends_on:
      site2-wordpress:
        condition: service_started
    environment:
      WM_DEV_BROKER_TOKEN: "wm-local-second-site-2026-isolated-dev-only-token"
      WORDPRESS_DB_HOST: site2-database:3306
      WORDPRESS_DB_NAME: wm_second_site
      WORDPRESS_DB_USER: wm_second_site
      WORDPRESS_DB_PASSWORD: local-second-site-only-password
    volumes:
      - second_site_files:/var/www/html
      - ./dev/local-site-provisioner.php:/opt/wm-local/provisioner.php:ro
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Internal Compose HTTP only; never publish this service's port.

  wpcli:
    image: wordpress:cli-2.12.0-php8.5
    profiles: ["tools"]
    depends_on:
      database:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: wordpress_dev
      WORDPRESS_DB_USER: wordpress_dev
      WORDPRESS_DB_PASSWORD: local-dev-only-wordpress-password
    volumes:
      - wordpress_files:/var/www/html
    working_dir: /var/www/html
    entrypoint: ["wp"]
    # One-off CLI invocations; this service does not run by default.

volumes:
  wordpress_database:
  wordpress_files:
  second_site_database:
  second_site_files:
